<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>DBStore · 车机应用商店</title>
    <link rel="icon" href="./logo.ico" type="image/x-icon">
    <style>
        :root {
            --bg: #fbfbfd;
            --bg-secondary: #f5f5f7;
            --card-bg: rgba(255, 255, 255, 0.78);
            --card-bg-solid: #ffffff;
            --text: #1d1d1f;
            --text-secondary: #6e6e73;
            --text-tertiary: #a1a1a6;
            --primary: #0071e3;
            --primary-hover: #0077ed;
            --primary-dark: #005bb5;
            --border: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.10);
            --radius-sm: 10px;
            --radius: 18px;
            --radius-lg: 24px;
            --transition: 0.32s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg: #000000;
            --bg-secondary: #1c1c1e;
            --card-bg: rgba(44, 44, 46, 0.78);
            --card-bg-solid: #1c1c1e;
            --text: #f5f5f7;
            --text-secondary: #98989d;
            --text-tertiary: #636366;
            --border: rgba(255, 255, 255, 0.10);
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.3);
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
                "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.47059;
            font-weight: 400;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-size: 17px;
            letter-spacing: -0.022em;
        }

        /* Sticky nav bar (iOS style) */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--card-bg);
            backdrop-filter: saturate(180%) blur(30px);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            border-bottom: 0.5px solid var(--border);
        }

        .navbar-inner {
            max-width: 1024px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            height: 52px;
            padding: 0 22px;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            letter-spacing: -0.022em;
        }

        .brand-mark {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: linear-gradient(135deg, var(--primary) 0%, #5856d6 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 2px 6px rgba(0, 113, 227, 0.3);
        }

        .nav-search {
            flex: 1;
            max-width: 280px;
            position: relative;
        }

        .nav-search input {
            width: 100%;
            height: 36px;
            padding: 0 14px 0 36px;
            border: none;
            border-radius: 10px;
            background: var(--bg-secondary);
            font-size: 14px;
            color: var(--text);
            font-family: inherit;
            transition: all var(--transition);
        }

        .nav-search input:focus {
            outline: none;
            background: var(--card-bg-solid);
            box-shadow: 0 0 0 2px var(--primary);
        }

        .nav-search input::placeholder { color: var(--text-secondary); }

        .nav-search svg {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            color: var(--text-secondary);
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto;
        }

        .icon-btn {
            width: 36px;
            height: 36px;
            border: none;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text);
            transition: background var(--transition);
        }

        .icon-btn:hover { background: var(--bg-secondary); }
        .icon-btn svg { width: 18px; height: 18px; }

        /* iOS-style category segmented control */
        .category-bar {
            background: var(--card-bg);
            backdrop-filter: saturate(180%) blur(30px);
            -webkit-backdrop-filter: saturate(180%) blur(30px);
            border-bottom: 0.5px solid var(--border);
            position: sticky;
            top: 52px;
            z-index: 99;
        }

        .category-bar-inner {
            max-width: 1024px;
            margin: 0 auto;
            padding: 10px 22px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        .category-bar-inner::-webkit-scrollbar { display: none; }

        .category-chips {
            display: flex;
            gap: 8px;
        }

        .category-chip {
            flex-shrink: 0;
            padding: 6px 14px;
            border: 0.5px solid var(--border);
            border-radius: 18px;
            background: var(--card-bg-solid);
            color: var(--text);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
            white-space: nowrap;
            user-select: none;
        }

        .category-chip:hover { transform: translateY(-1px); }
        .category-chip:active { transform: scale(0.96); }
        .category-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 113, 227, 0.3);
        }

        /* Main container */
        .container {
            max-width: 1024px;
            margin: 0 auto;
            padding: 0 22px;
        }

        .main { padding: 24px 0 60px; }

        /* iOS-style large title */
        .large-title-wrap {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .large-title {
            font-size: 40px;
            line-height: 1.05;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text);
        }

        .large-title-sub {
            font-size: 17px;
            color: var(--text-secondary);
            margin-top: 4px;
            letter-spacing: -0.022em;
        }

        .results-count {
            font-size: 13px;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 5px 12px;
            border-radius: 14px;
        }

        /* Featured Hero Carousel */
        .hero {
            position: relative;
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: 40px;
            background: linear-gradient(135deg, var(--primary) 0%, #5856d6 100%);
            color: white;
            min-height: 280px;
            box-shadow: var(--shadow-lg);
        }

        .hero-slide {
            padding: 40px;
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 32px;
            align-items: center;
            min-height: 280px;
            transition: opacity 0.5s ease;
        }

        .hero-content { z-index: 2; }
        .hero-eyebrow {
            font-size: 13px;
            font-weight: 600;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 8px;
        }

        .hero-title {
            font-size: 36px;
            font-weight: 700;
            line-height: 1.1;
            letter-spacing: -0.025em;
            margin-bottom: 12px;
        }

        .hero-desc {
            font-size: 16px;
            line-height: 1.5;
            opacity: 0.9;
            margin-bottom: 24px;
            max-width: 380px;
        }

        .hero-cta {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 22px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            font-family: inherit;
        }

        .hero-cta:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-1px);
        }

        .hero-cta:active { transform: scale(0.97); }

        .hero-icon-wrap {
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        .hero-icon {
            width: 160px;
            height: 160px;
            border-radius: 32px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            object-fit: contain;
            background: white;
            padding: 12px;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hero-icon:hover { transform: scale(1.05) rotate(-2deg); }

        .hero-indicators {
            position: absolute;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            z-index: 3;
        }

        .hero-dot {
            width: 6px;
            height: 6px;
            border-radius: 3px;
            background: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            padding: 0;
        }

        .hero-dot.active {
            background: white;
            width: 18px;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: -40%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Section headings */
        .section { margin-bottom: 36px; }

        .section-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.022em;
            color: var(--text);
        }

        .section-sub {
            font-size: 13px;
            color: var(--text-secondary);
        }

        /* App grid */
        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        .app-card {
            background: var(--card-bg-solid);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 14px 18px;
            text-align: center;
            cursor: pointer;
            transition: all var(--transition);
            position: relative;
            animation: cardIn 0.4s ease backwards;
        }

        .app-card:nth-child(1) { animation-delay: 0.02s; }
        .app-card:nth-child(2) { animation-delay: 0.04s; }
        .app-card:nth-child(3) { animation-delay: 0.06s; }
        .app-card:nth-child(4) { animation-delay: 0.08s; }
        .app-card:nth-child(5) { animation-delay: 0.10s; }
        .app-card:nth-child(6) { animation-delay: 0.12s; }
        .app-card:nth-child(7) { animation-delay: 0.14s; }
        .app-card:nth-child(8) { animation-delay: 0.16s; }

        @keyframes cardIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .app-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
            border-color: transparent;
        }

        .app-card:active { transform: translateY(-1px) scale(0.99); }

        .app-icon-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 12px;
        }

        .app-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: cover;
            transition: transform var(--transition);
        }

        .app-card:hover .app-icon { transform: scale(1.06); }

        .app-tags {
            position: absolute;
            top: -4px;
            right: -8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .app-tag {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .app-tag.hot { background: #ff3b30; color: white; }
        .app-tag.new { background: #34c759; color: white; }
        .app-tag.editor { background: #ff9500; color: white; }
        .app-tag.free { background: #5856d6; color: white; }

        .app-card h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: -0.016em;
        }

        .app-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            display: flex;
            justify-content: center;
            gap: 4px;
            align-items: center;
        }

        .meta-sep { opacity: 0.4; }

        .install-btn {
            width: 100%;
            height: 32px;
            background: var(--bg-secondary);
            color: var(--primary);
            border: none;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            font-family: inherit;
            letter-spacing: -0.01em;
        }

        .install-btn:hover {
            background: var(--primary);
            color: white;
        }

        /* Skeleton */
        .skeleton-card {
            background: var(--card-bg-solid);
            border: 0.5px solid var(--border);
            border-radius: var(--radius);
            padding: 22px 14px 18px;
            text-align: center;
        }

        .skeleton {
            background: linear-gradient(90deg,
                var(--bg-secondary) 0%,
                rgba(0,0,0,0.04) 50%,
                var(--bg-secondary) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }

        [data-theme="dark"] .skeleton {
            background: linear-gradient(90deg,
                var(--bg-secondary) 0%,
                rgba(255,255,255,0.06) 50%,
                var(--bg-secondary) 100%);
            background-size: 200% 100%;
        }

        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .sk-icon { width: 64px; height: 64px; border-radius: 14px; margin: 0 auto 12px; }
        .sk-line { height: 12px; margin: 0 auto 6px; }
        .sk-line.w-60 { width: 60%; }
        .sk-line.w-40 { width: 40%; }
        .sk-btn { width: 100%; height: 32px; border-radius: 16px; margin-top: 6px; }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-secondary);
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 16px;
            background: var(--bg-secondary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg { width: 32px; height: 32px; color: var(--text-tertiary); }
        .empty-state h3 { font-size: 17px; font-weight: 600; margin-bottom: 4px; color: var(--text); }
        .empty-state p { font-size: 14px; }

        /* Modal (iOS style sheet) */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 24px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { display: flex; opacity: 1; }

        .modal {
            background: var(--card-bg-solid);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
            transform: scale(0.92) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-overlay.active .modal { transform: scale(1) translateY(0); }

        .modal-header {
            padding: 28px 24px 20px;
            text-align: center;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background: var(--bg-secondary);
            cursor: pointer;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            transition: all var(--transition);
        }

        .modal-close:hover { background: rgba(0,0,0,0.1); color: var(--text); }

        .modal-icon-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 14px;
        }

        .modal-icon {
            width: 88px;
            height: 88px;
            border-radius: 20px;
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .modal-tags {
            position: absolute;
            top: -4px;
            right: -8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .modal-tag {
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 4px;
        }
        .modal-tag.hot { background: #ff3b30; color: white; }
        .modal-tag.new { background: #34c759; color: white; }
        .modal-tag.editor { background: #ff9500; color: white; }
        .modal-tag.free { background: #5856d6; color: white; }

        .modal-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
            letter-spacing: -0.022em;
        }

        .modal-header > p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .modal-body { padding: 0 24px 20px; }

        .app-desc {
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
            line-height: 1.5;
            margin-bottom: 18px;
            padding-bottom: 18px;
            border-bottom: 0.5px solid var(--border);
        }

        .info-list {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 11px 14px;
            font-size: 14px;
            border-bottom: 0.5px solid var(--border);
        }

        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-secondary); }
        .info-value { color: var(--text); font-weight: 500; }
        .info-value.tag { color: var(--primary); }

        .url-section { margin-top: 18px; }

        .url-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .url-row { display: flex; gap: 8px; }

        .url-input {
            flex: 1;
            height: 38px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 8px;
            padding: 0 12px;
            font-size: 12px;
            color: var(--text-secondary);
            font-family: inherit;
        }

        .url-input:focus { outline: 0.5px solid var(--primary); }

        .copy-btn {
            height: 38px;
            padding: 0 16px;
            background: var(--bg-secondary);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            color: var(--primary);
            transition: background var(--transition);
            font-family: inherit;
        }

        .copy-btn:hover { background: rgba(0, 113, 227, 0.1); }
        .copy-btn.copied { background: var(--primary); color: white; }

        .modal-footer { padding: 4px 24px 24px; }

        .download-btn {
            width: 100%;
            height: 50px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
            letter-spacing: -0.022em;
        }

        .download-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
        .download-btn:active { transform: scale(0.99); }
        .download-btn svg { width: 20px; height: 20px; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(29, 29, 31, 0.92);
            color: white;
            padding: 12px 24px;
            border-radius: 22px;
            font-size: 14px;
            font-weight: 500;
            z-index: 300;
            opacity: 0;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 10px 32px rgba(0, 0, 0, 0.3);
            letter-spacing: -0.01em;
        }

        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* QR Modal */
        .qr-modal { max-width: 380px; }
        .qr-body {
            padding: 16px 24px 28px;
            text-align: center;
        }

        .qr-body p { font-size: 14px; color: var(--text); margin-bottom: 16px; }
        .qr-img {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            object-fit: cover;
            margin: 0 auto;
            display: block;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 24px;
            color: var(--text-tertiary);
            font-size: 12px;
            border-top: 0.5px solid var(--border);
        }

        footer a { color: var(--primary); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        /* Responsive */
        @media (max-width: 768px) {
            body { font-size: 15px; }
            .navbar-inner { padding: 0 16px; height: 48px; }
            .nav-search { max-width: none; }
            .nav-search input { height: 34px; font-size: 14px; }
            .category-bar { top: 48px; }

    <!-- Toast -->

    <!-- QR Modal -->
    <div class="modal-overlay" id="qrModalOverlay" role="dialog" aria-modal="true">

            <div class="modal-header">

                <p>回复 03 获取安装工具</p>
            </div>

                <p>长按或扫码识别下方二维码</p>
                <img src="./wechat_qrcode.png" alt="公众号二维码" class="qr-img" onerror="this.style.display='none'">
                <p style="font-size: 13px; color: var(--text-secondary); margin-top: 14px; margin-bottom: 0;">徐大兵微信：<strong style="color: var(--text);">554719247</strong></p>
            </div>
        </div>
    </div>

    <script>
        const state = {
            apps: [],
            filteredApps: [],
            searchQuery: '',
            currentCategory: '全部',
            heroIndex: 0,
            heroTimer: null
        };

        // Default fallback apps
        const defaultApps = [
            { id: "hyapp", name: "HYCarPlay", url: "./apps/hyapp.apk", size: "5.87 MB", icon: "./icons/hyapp.png", version: "2.1.0", category: "工具", description: "需要搭配盒子使用，如需购买请联系徐大兵wechat：554719247" },
            { id: "qishui", name: "汽水音乐车机版", url: "./apps/qishui.apk", size: "37.23 MB", icon: "./icons/qishui.png", version: "5.3.1", category: "音乐", description: "字节跳动比较火的音乐播放器" },
            { id: "yingongguanjia", name: "应用管家", url: "./apps/yingongguanjia.apk", size: "14.86 MB", icon: "./icons/yingongguanjia.png", version: "v1.8.6", category: "工具", description: "应用管家v1.8.6（5月18日）-修复了文件下载&固定互传IP" },
            { id: "gaode", name: "高德地图车机版", url: "https://1843828265.share.123865.com/123pan/Ny2bTd-JPr8d", size: "120.26 MB", icon: "./icons/gaode.png", version: "9.1", category: "导航", description: "高德地图9.1.（6群车友修改）正式版-领克OSN专用-科技地图-低调官灯旗帜-玩偶车标-悬浮-8.5fun2026.1.6" },
            { id: "applemusic", name: "Apple Music", url: "https://1843828265.share.123865.com/123pan/Ny2bTd-zdp8d", size: "136.76 MB", icon: "./icons/AppleMusic.png", version: "4.2.0", category: "音乐", description: "Apple Music丨v4.9.5.11_大屏版" },
            { id: "shuiguo", name: "水果互联", url: "./apps/shuiguo.apk", size: "28.82 MB", icon: "./icons/shuiguo.jpg", version: "176", category: "工具", description: "免费试用如需购买ukey请联系徐大兵wechat：554719247" },
            { id: "qidongqi", name: "启动器", url: "./apps/qidongqi.apk", size: "4.75 MB", icon: "./icons/qidongqi.png", version: "1.2.0", category: "工具", description: "车机必装应用" },
            { id: "lynktool", name: "领克工具箱", url: "./apps/lynktool.apk", size: "4.75 MB", icon: "./icons/lynktool.png", version: "V0.5.6", category: "工具", description: "领克OSN车机助手(HUD自定义，方控支持三方) v0.5.6-By.Cheter.Chao" }
        ];

        // Editor picks (first 3 apps featured in hero)
        const editorPicks = ['applemusic', 'gaode', 'qishui'];

        // Tag assignments for known apps
        const tagRules = {
            applemusic: ['热门'],
            gaode: [ '必备'],
            qishui: ['最新'],
            hyapp: ['必备'],
            qidongqi: ['必备'],
            lynktool: ['最新'],
            yingongguanjia: [],
            shuiguo: []
        };

        const $ = id => document.getElementById(id);

        async function loadApps() {
            try {
                const res = await fetch('./apps.json?t=' + Date.now(), { cache: 'no-store' });
                state.apps = await res.json();
            } catch (e) {
                state.apps = defaultApps;
            }
            // Apply tags based on rules
            state.apps = state.apps.map(a => ({
                ...a,
                tags: tagRules[a.id] || []
            }));
            applyFilters();
            initHero();
        }

        function applyFilters() {
            let apps = [...state.apps];

            // Category filter
            if (state.currentCategory && state.currentCategory !== '全部') {
                if (state.currentCategory === '推荐') {
                    apps = apps.filter(a => a.tags && (a.tags.includes('编辑推荐') || a.tags.includes('必备')));
                } else {
                    apps = apps.filter(a => a.category === state.currentCategory);
                }
            }

            // Search filter
            if (state.searchQuery) {
                const q = state.searchQuery.toLowerCase();
                apps = apps.filter(a =>
                    a.name.toLowerCase().includes(q) ||
                    (a.category && a.category.toLowerCase().includes(q)) ||
                    (a.description && a.description.toLowerCase().includes(q))
                );
            }

            state.filteredApps = apps;
            renderApps();
        }

        function renderApps() {
            const { filteredApps, currentCategory, searchQuery } = state;
            const title = searchQuery
                ? `搜索"${searchQuery}"`
                : (currentCategory === '全部' ? '全部应用' : currentCategory);

            $('sectionTitle').textContent = title;
            $('appCount').textContent = `${filteredApps.length} 个应用`;

            const grid = $('appGrid');

            if (filteredApps.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div class="empty-icon">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="11" cy="11" r="8"/>
                                <path d="m21 21-4.35-4.35"/>
                            </svg>
                        </div>
                        <h3>未找到应用</h3>
                        <p>尝试其他关键词或分类</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filteredApps.map(app => `
                <div class="app-card" data-id="${app.id}" role="listitem" tabindex="0">
                    <div class="app-icon-wrap">
                        <img class="app-icon" src="${app.icon}" data-base="${app.icon}" alt="${esc(app.name)}" loading="lazy" onerror="this.style.opacity='0'">
                        ${renderAppTags(app.tags)}
                    </div>
                    <h3>${esc(app.name)}</h3>
                    <p class="app-meta">
                        <span>${app.category || '应用'}</span>
                        <span class="meta-sep">·</span>
                        <span>${app.size || ''}</span>
                    </p>
                    <button class="install-btn">获取</button>
                </div>
            `).join('');
        }

        function renderSkeleton() {
            const grid = $('appGrid');
            grid.innerHTML = Array(8).fill(0).map(() => `
                <div class="skeleton-card">
                    <div class="skeleton sk-icon"></div>
                    <div class="skeleton sk-line w-60"></div>
                    <div class="skeleton sk-line w-40"></div>
                    <div class="skeleton sk-btn"></div>
                </div>
            `).join('');
        }

        function renderAppTags(tags = []) {
            if (!tags || tags.length === 0) return '';
            return `<div class="app-tags">${tags.slice(0, 2).map(tag => {
                const cls = tag === '热门' || tag === '必备' ? 'hot' :
                            tag === '最新' ? 'new' :
                            tag === '编辑推荐' ? 'editor' :
                            tag === '免费' ? 'free' : '';
                return `<span class="app-tag ${cls}">${esc(tag)}</span>`;
            }).join('')}</div>`;
        }

        function esc(str) {
            const div = document.createElement('div');
            div.textContent = str || '';
            return div.innerHTML;
        }

        function showToast(message) {
            const toast = $('toast');
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(showToast._t);
            showToast._t = setTimeout(() => toast.classList.remove('show'), 2400);
        }

        function copyText(text, msg) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(msg || '已复制');
            }).catch(() => showToast('复制失败'));
        }

        function openQRModal() {
            $('qrModalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeQRModal() {
            $('qrModalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function openModal(app) {
            const isExternal = app.url.startsWith('http');
            const url = isExternal ? app.url : `${getBaseUrl()}/${app.url.replace(/^\.\//, '')}`;

            $('modalIcon').src = resolveUrl(app.icon);
            $('modalIcon').alt = app.name;
            $('modalTitle').textContent = app.name;
            $('modalSubtitle').textContent = (app.category || '应用') + ' · Android';
            $('modalDesc').textContent = app.description || '精选车机应用';
            $('modalSize').textContent = app.size || '-';
            $('modalVersion').textContent = app.version || '-';
            $('modalCategory').textContent = app.category || '其他';
            $('modalUrl').value = url;
            $('modalDownload').href = url;
            $('modalDownload').download = isExternal ? '' : `${app.name}.apk`;
            $('modalTags').innerHTML = renderAppTags(app.tags || []);

            $('modalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            $('modalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function getBaseUrl() {
            return window.location.href.replace(/\/[^\/]*$/, '') || window.location.origin;
        }

        // 标准化相对路径为完整 file:// / http:// URL，避免 file:// 协议下相对路径解析不一致
        function resolveUrl(relativePath) {
            if (!relativePath) return '';
            if (/^(https?:|file:)/.test(relativePath)) return relativePath;
            const cleaned = relativePath.replace(/^\.\//, '');
            try {
                return new URL(cleaned, document.baseURI).href;
            } catch (e) {
                return `${getBaseUrl()}/${cleaned}`;
            }
        }

        function updateThemeIcon() {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            $('themeIcon').innerHTML = isDark
                ? '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'
                : '<path d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/>';
        }

        // Hero carousel
        function initHero() {
            const featured = editorPicks
                .map(id => state.apps.find(a => a.id === id))
                .filter(Boolean);

            if (featured.length === 0) {
                $('hero').style.display = 'none';
                return;
            }

            const indicators = $('heroIndicators');
            indicators.innerHTML = featured.map((_, i) =>
                `<button class="hero-dot ${i === 0 ? 'active' : ''}" data-i="${i}" aria-label="切换到第${i+1}个"></button>`
            ).join('');

            indicators.querySelectorAll('.hero-dot').forEach(dot => {
                dot.addEventListener('click', () => {
                    state.heroIndex = parseInt(dot.dataset.i);
                    updateHero(featured);
                    resetHeroTimer(featured);
                });
            });

            state.heroTimer = setInterval(() => {
                state.heroIndex = (state.heroIndex + 1) % featured.length;
                updateHero(featured);
            }, 5000);

            updateHero(featured);
        }

        function updateHero(featured) {
            const app = featured[state.heroIndex];
            if (!app) return;
            $('heroEyebrow').textContent = '编辑精选';
            $('heroTitle').textContent = app.name;
            // 截取 description 的首行（去掉"已移除的低版本"等备注），再限制长度
            const rawDesc = (app.description || '').split('\n')[0].trim();
            $('heroDesc').textContent = rawDesc.length > 60 ? rawDesc.slice(0, 60) + '…' : (rawDesc || '精选车机应用');
            $('heroIcon').src = resolveUrl(app.icon);
            $('heroIcon').alt = app.name;
            $('heroCta').onclick = () => openModal(app);

            document.querySelectorAll('.hero-dot').forEach((d, i) => {
                d.classList.toggle('active', i === state.heroIndex);
            });
        }

        function resetHeroTimer(featured) {
            clearInterval(state.heroTimer);
            state.heroTimer = setInterval(() => {
                state.heroIndex = (state.heroIndex + 1) % featured.length;
                updateHero(featured);
            }, 5000);
        }

        // Event listeners
        $('appGrid').addEventListener('click', (e) => {
            const card = e.target.closest('.app-card');
            if (!card) return;
            const app = state.apps.find(a => a.id === card.dataset.id);
            if (app) openModal(app);
        });

        $('appGrid').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
                const card = e.target.closest('.app-card');
                if (card) {
                    e.preventDefault();
                    const app = state.apps.find(a => a.id === card.dataset.id);
                    if (app) openModal(app);
                }
            }
        });

        let searchTimeout;
        $('searchInput').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                state.searchQuery = e.target.value.trim();
                applyFilters();
            }, 200);
        });

        // Category chips
        document.querySelectorAll('.category-chip').forEach(chip => {
            chip.addEventListener('click', () => {
                document.querySelectorAll('.category-chip').forEach(c => c.classList.remove('active'));
                chip.classList.add('active');
                state.currentCategory = chip.dataset.cat;
                applyFilters();
            });
        });

        $('modalCloseBtn').addEventListener('click', closeModal);
        $('modalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeModal();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if ($('modalOverlay').classList.contains('active')) closeModal();
                if ($('qrModalOverlay').classList.contains('active')) closeQRModal();
            }
        });

        $('qrModalCloseBtn').addEventListener('click', closeQRModal);
        $('qrModalOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) closeQRModal();
        });

        $('modalCopy').addEventListener('click', function() {
            const url = $('modalUrl').value;
            navigator.clipboard.writeText(url).then(() => {
                this.textContent = '已复制';
                this.classList.add('copied');
                showToast('链接已复制');
                setTimeout(() => {
                    this.textContent = '复制';
                    this.classList.remove('copied');
                }, 2000);
            }).catch(() => showToast('复制失败'));
        });

        $('themeToggle').addEventListener('click', () => {
            const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
            document.documentElement.setAttribute('data-theme', isDark ? 'light' : 'dark');
            localStorage.setItem('theme', isDark ? 'light' : 'dark');
            updateThemeIcon();
        });

        // Init theme
        if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
        }
        updateThemeIcon();

        // Show skeleton briefly for nice UX
        renderSkeleton();
        loadApps();
    </script>
</body>
</html>
