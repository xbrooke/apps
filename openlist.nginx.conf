# OpenList v4 推荐 nginx 配置（全反代版）
#
# 部署位置: /etc/nginx/conf.d/openlist.conf
# 使用方法:
#   1. 把 server_name 改成你的域名
#   2. 把 127.0.0.1:5244 改成 OpenList 后端实际监听的地址
#   3. nginx -t && nginx -s reload
#
# 如果你用 Cloudflare 反代（推荐，自动 HTTPS + CDN 加速国内访问）：
#   - 在 Cloudflare 后台把 SSL/TLS 设为 "Full"
#   - Cloudflare 源站证书用 nginx 的 ssl_certificate / ssl_certificate_key
#   - 在本配置 server 块里加 listen 443 ssl http2;

upstream openlist_backend {
    server 127.0.0.1:5244;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name appstore.cnmlynk.org;

    # 强制 HTTPS（如果用了 Cloudflare + Let's Encrypt，取消下行注释）
    # return 301 https://$host$request_uri;

    # 客户端上传 APK 可能很大，关掉请求体缓冲
    client_max_body_size 0;
    client_body_buffer_size 16M;
    client_body_timeout 300s;

    # 下载响应缓冲（车机下载大 APK 时不缓冲，减少内存压力）
    proxy_buffering off;
    proxy_request_buffering off;

    # 日志
    access_log /var/log/nginx/openlist_access.log;
    error_log  /var/log/nginx/openlist_error.log;

    # ============================================
    # 关键：全反代到 OpenList 后端
    # 不要在 /api/ 之前加 try_files /index.html，
    # 那是常见错误，会把 POST /api/authn/login 等路径 fallback 到 SPA HTML
    # ============================================
    location / {
        proxy_pass http://openlist_backend;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSocket / SSE 支持
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        # 长传 / 大文件下载超时
        proxy_connect_timeout 60s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        send_timeout          600s;
    }
}

